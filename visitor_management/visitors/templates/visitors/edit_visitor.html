{% extends "visitors/base.html" %}
{% block content %}

<section class="visitor-entry-section">
<div class="entry-card">

<div class="entry-header">
    Edit Visitor
</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">{% csrf_token %}

<div class="row g-3">

<div class="col-md-6">
<label>Name</label>
<input type="text" name="name"
       value="{{ visitor.name }}"
       class="form-control">
</div>

<div class="col-md-6">
<label>Mobile</label>
<input type="text" name="mobile"
       value="{{ visitor.mobile }}"
       class="form-control">
</div>

<div class="col-md-6">
<label>Email</label>
<input type="email" name="email"
       value="{{ visitor.email }}"
       class="form-control">
</div>

<div class="col-md-6">
<label>Gender</label>
<select name="gender" class="form-select">
<option {% if visitor.gender == "Male" %}selected{% endif %}>Male</option>
<option {% if visitor.gender == "Female" %}selected{% endif %}>Female</option>
<option {% if visitor.gender == "Other" %}selected{% endif %}>Other</option>
</select>
</div>

<div class="col-12">
<label>Address</label>
<textarea name="address"
          class="form-control">{{ visitor.address }}</textarea>
</div>

<div class="col-md-6">
<label>Aadhaar</label>
<input type="datetime-local"
       value="{{ visitor.entry_time|date:'Y-m-d\\TH:i' }}"
       class="form-control"
       readonly>
</div>

<div class="col-md-6">
<label>Purpose</label>
<input type="text" name="purpose"
       value="{{ visitor.purpose }}"
       class="form-control">
</div>

<div class="col-md-6">
<label>Visit To</label>
<input type="text" name="visit_to"
       value="{{ visitor.visit_to }}"
       class="form-control">
</div>

<div class="col-md-6">
<label>Hostel / Office</label>
<input type="text" name="hostel_or_office"
       value="{{ visitor.hostel_or_office }}"
       class="form-control">
</div>
<div class="col-md-6">
<label>Entry Time</label>
<input type="datetime-local"
       name="entry_time"
       value="{{ visitor.entry_time|date:'Y-m-d\\TH:i' }}"
       class="form-control">
</div>
<div class="col-md-6">
<label>Exit Time</label>
<input type="datetime-local"
       name="exit_time"
       value="{{ visitor.exit_time|date:'Y-m-d\\TH:i' }}"
       class="form-control">
</div>
<div class="col-md-6">
<label>Photo</label><br>

{% if visitor.photo %}
    <img src="{{ visitor.photo.url }}"
         width="80"
         class="img-thumbnail mb-2">
{% endif %}

<input type="file"
       name="photo"
       class="form-control">
</div>
<div class="col-md-6">
<label>Signature</label><br>

{% if visitor.signature %}
    <img src="{{ visitor.signature.url }}"
         width="80"
         class="img-thumbnail mb-2">
{% endif %}

<input type="file"
       name="signature"
       class="form-control">
</div>
{% if request.user.is_superuser %}
<div class="col-md-6">
<label>Status</label>
<select name="status" class="form-select">
<option value="IN" {% if visitor.status == "IN" %}selected{% endif %}>IN</option>
<option value="OUT" {% if visitor.status == "OUT" %}selected{% endif %}>OUT</option>
</select>
</div>
{% endif %}

<div class="col-12">
<label>Remark</label>
<textarea name="remark"
          class="form-control">{{ visitor.remark }}</textarea>
</div>

</div>

<div class="text-end mt-4">
<button type="submit" class="btn btn-primary">
    Update Visitor
</button>
<a href="{% url 'visitor_list' %}" class="btn btn-secondary">
    Cancel
</a>
</div>

</form>

</div>
</div>
</section>

{% endblock %}
