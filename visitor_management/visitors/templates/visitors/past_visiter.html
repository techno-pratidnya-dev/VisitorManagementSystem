<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Visitors | LinkedIn Style | VMS</title>
    <!-- Use Flask url_for for static files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern LinkedIn-style enhancements */
        :root {
            --linkedin-blue: #0a66c2;
            --linkedin-gray: #f3f2ef;
            --linkedin-border: #ebebeb;
            --linkedin-text: rgba(0,0,0,0.9);
            --linkedin-muted: rgba(0,0,0,0.6);
        }

        body {
            background-color: var(--linkedin-gray);
            color: var(--linkedin-text);
        }

        .main-content {
            background-color: var(--linkedin-gray);
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--linkedin-border);
            padding: 0.75rem 2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .feed-container {
            max-width: 555px; /* LinkedIn Feed Width style */
            margin: 1.5rem auto;
        }

        .visitor-card {
            border: 1px solid var(--linkedin-border);
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: none;
        }

        .card-header {
            padding: 12px 16px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .user-text h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--linkedin-text);
        }

        .visit-meta {
            font-size: 0.75rem;
            color: var(--linkedin-muted);
        }

        .purpose-text {
            font-size: 0.9rem;
            padding: 0 16px 8px;
            color: var(--linkedin-text);
        }

        .meeting-with {
            padding: 0 16px 12px;
            font-size: 0.85rem;
            color: var(--linkedin-blue);
            font-weight: 600;
        }

        .card-media img {
            border-top: 1px solid var(--linkedin-border);
            border-bottom: 1px solid var(--linkedin-border);
        }

        .card-footer {
            padding: 4px 12px;
            border-top: none;
        }

        .action-row {
            padding-top: 4px;
            border-top: 1px solid var(--linkedin-border);
        }

        .interaction-btn {
            padding: 10px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .interaction-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .status-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: var(--linkedin-blue);
        }

        .btn-primary:hover {
            background-color: #004182;
        }

        /* Sidebar styling to match LinkedIn sidebar boxes */
        .sidebar {
            background: transparent;
            border-right: none;
            width: 225px;
            padding-top: 1.5rem;
        }

        .sidebar-header, .sidebar-nav, .sidebar-footer {
            background: #fff;
            border: 1px solid var(--linkedin-border);
            border-radius: 8px;
            margin-bottom: 8px;
            margin-left: 1rem;
            margin-right: 1rem;
        }

        .nav-item.active {
            background: transparent;
            border-left: none;
            color: var(--linkedin-blue);
        }

        .nav-item:hover {
            text-decoration: underline;
            color: var(--linkedin-blue);
        }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="branding">
                    <i class="fa-solid fa-building-user"></i>
                    <span>VMS Admin</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="/" class="nav-item">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                    <a href="/past-visitors" class="nav-item active">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Past Visitors</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="date-picker-box">
                    <label><i class="fa-regular fa-calendar-days"></i> Filter by Date</label>
                    <input type="date" id="dateSelect">
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <div class="title-container">
                    <h1>Feed</h1>
                </div>
                <div class="search-filter-box">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search visitors or purpose...">
                    </div>
                    <div class="filter-dropdown">
                        <select id="statusFilter">
                            <option value="All Status">All Status</option>
                            <option value="Visited">Visited</option>
                            <option value="Pending">Pending</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addVisitorBtn"><i class="fa-solid fa-plus"></i> New Entry</button>
                    <button class="btn-icon mobile-menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                </div>
            </header>

            <div class="feed-container" id="visitorFeed">
                <!-- Data will be injected here via JavaScript -->
                <div class="visitor-card skeleton" style="height: 400px;"></div>
            </div>
        </main>
    </div>

    <!-- Generic Form Modal -->
    <div id="visitorModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Visitor Entry</h2>
                <button class="close-modal">&times;</button>
            </div>
            <form id="visitorForm" class="modal-body">
                <input type="hidden" id="visitorId">
                <div class="form-group">
                    <label>Visitor Name</label>
                    <input type="text" id="vName" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Purpose of Visit</label>
                    <textarea id="vPurpose" required placeholder="What is the visit about?"></textarea>
                </div>
                <div class="form-group">
                    <label>Meeting With</label>
                    <input type="text" id="vMeetingWith" required placeholder="Person / Department">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="vStatus">
                        <option value="Visited">Visited</option>
                        <option value="Pending">Pending</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Use Flask url_for for scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
