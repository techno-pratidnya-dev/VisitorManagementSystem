{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Management System - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

```
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="{% static 'visitors/css/login.css' %}">

<style>
    body{
        font-family: 'Poppins', sans-serif;
        background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                          url("{% static 'visitors/images/login.webp' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
```

</head>

<body>

<div class="login-container">
    <div class="login-card shadow-lg">

```
    <h2 class="text-center mb-4">Visitor Management System</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Email or Username" required>
        </div>

        <div class="mb-3 position-relative">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary">Sign In</button>
        </div>

        <div class="login-footer text-center">
            <div class="divider mb-2">
                <span>OR</span>
            </div>

            <p class="signup-text">
                Don’t have an account?
                <a href="{% url 'register' %}" class="signup-btn">
                    Create Account
                </a>
            </p>
        </div>

    </form>

</div>
```

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script src="{% static 'visitors/js/login.js' %}"></script>

</body>
</html>
