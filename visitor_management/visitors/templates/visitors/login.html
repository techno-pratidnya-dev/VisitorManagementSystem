{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Management System - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'visitors/css/login.css' %}">
</head>

<body>

<div class="login-container">
    <div class="login-card">
        <h2>Visitor Management System</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Email (or Username)" required>
            </div>

            <div class="mb-3 position-relative">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Sign In</button>
            </div>
            <div class="login-footer">
    <div class="divider">
        <span>OR</span>
    </div>

    <p class="signup-text">
        Don’t have an account?
        <a href="{% url 'register' %}" class="signup-btn">
            Create Account
        </a>
    </p>
</div>

        </form>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}
    </div>
</div>

<!-- Custom JS -->
<script src="{% static 'visitors/js/login.js' %}"></script>

</body>
</html>
