<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Visitors | Visitor Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ================= LOGO HEADER SECTION ================= -->
    <div class="header-section py-3 bg-light" style="border-bottom: 1px solid #e5e7eb;">
        <div class="container-fluid px-5 d-flex justify-content-between align-items-center flex-wrap" style="display:flex; justify-content:space-between; align-items:center; padding: 10px 50px; background: white;">
            <!-- Logo -->
            <div class="d-flex align-items-center">
                <h2 style="color: #1a4f8b; margin: 0; font-family: 'Poppins', sans-serif;"><i class="fa-solid fa-house" style="margin-right: 10px;"></i>Vidhyarthi Sahayak Samiti</h2>
            </div>
            <!-- Contact Boxes -->
            <div class="contact-boxes d-flex align-items-center gap-4" style="display:flex; gap: 20px; font-family: 'Poppins', sans-serif;">
                <div class="contact-item" style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-phone" style="font-size:20px; color:#1a4f8b;"></i>
                    <div style="font-size:12px;"><strong>PHONE</strong><br>020-25533631</div>
                </div>
            </div>
        </div>
    </div>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-dark shadow-sm py-2" style="background: linear-gradient(270deg, #0f172a, #1e3a8a, #114c86); padding: 12px 50px; color: white; display:flex; justify-content: space-between; font-family: 'Poppins', sans-serif;">
        <div style="display:flex; gap:20px;">
            <a href="http://127.0.0.1:8000/visitors/dashboard/" style="color:white; text-decoration:none; font-weight:500;">Dashboard</a>
            <a href="http://127.0.0.1:8000/visitors/add/" style="color:white; text-decoration:none; font-weight:500;">Add Visitor</a>
        </div>
        <div style="font-size: 14px;">
            Hi, Admin | <a href="http://127.0.0.1:8000/visitors/logout/" style="color:white; text-decoration:underline;">Logout</a>
        </div>
    </nav>

    <div class="app-container" style="height: calc(100vh - 120px);">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="branding">
                    <i class="fa-solid fa-house"></i>
                    <span>Vidhyarthi Sahayak Samiti</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="http://127.0.0.1:8000/visitors/dashboard/" class="nav-item">
                        <i class="fa-solid fa-gauge-high"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="http://127.0.0.1:8000/visitors/add/" class="nav-item">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Add Visitor</span>
                    </a>
                    <a href="http://127.0.0.1:8000/visitors/" class="nav-item">
                        <i class="fa-solid fa-users-viewfinder"></i>
                        <span>Visitor List</span>
                    </a>
                </div>

                <div class="nav-divider"></div>

                <div class="nav-section">
                    <a href="http://127.0.0.1:8000/visitors/profile/" class="nav-item">
                        <i class="fa-solid fa-circle-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="http://127.0.0.1:8000/visitors/about/" class="nav-item">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>About Us</span>
                    </a>
                    <a href="/past-visitors" class="nav-item active">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Past Visited Visitor</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="date-picker-box">
                    <label>Select date</label>
                    <input type="date" id="dateSelect">
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <div class="title-container">
                    <h1>Past Visitors</h1>
                </div>
                <div class="search-filter-box">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search visitors...">
                    </div>
                    <div class="filter-dropdown">
                        <select id="statusFilter">
                            <option value="All">All Status</option>
                            <option value="Visited">Visited</option>
                            <option value="Pending">Pending</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addVisitorBtn"><i class="fa-solid fa-plus"></i> Add</button>
                    <button class="btn-icon mobile-menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                </div>
            </header>

            <div class="feed-container" id="visitorFeed">
                <!-- Skeleton items will be here initially -->
                <div class="visitor-card skeleton" style="height: 400px;"></div>
            </div>
        </main>
    </div>

    <!-- Generic Form Modal -->
    <div id="visitorModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Visitor</h2>
                <button class="close-modal">&times;</button>
            </div>
            <form id="visitorForm" class="modal-body">
                <input type="hidden" id="visitorId">
                <div class="form-group">
                    <label>Visitor Name</label>
                    <input type="text" id="vName" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Purpose of Visit</label>
                    <textarea id="vPurpose" required placeholder="Meeting details..."></textarea>
                </div>
                <div class="form-group">
                    <label>Meeting With</label>
                    <input type="text" id="vMeetingWith" required placeholder="Employee Name / Dept">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="vStatus">
                        <option value="Visited">Visited</option>
                        <option value="Pending">Pending</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="form-group" style="border: 2px dashed #cbd5e1; padding: 15px; text-align: center; border-radius: 8px;">
                    <label style="display:block; margin-bottom: 8px; color: #64748b; font-weight: 500;">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Upload Visitor Photo (Optional)
                    </label>
                    <input type="file" id="vImage" name="vImage" accept="image/*" style="width: 100%;">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Visitor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
